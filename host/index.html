<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>GateCue · Alexa+ simulator</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="./host.css">
</head><body>
<header class="bar">
  <strong>GateCue · Alexa+ simulator</strong>
  <nav aria-label="Device">
    <button data-device="echo-show-8">Echo Show 8</button><button data-device="echo-show-15">Echo Show 15</button><button data-device="mobile">Phone</button><button data-device="voice">Voice only</button>
  </nav>
  <button id="theme">Light / dark</button>
  <button id="voice" aria-pressed="true">Voice on</button>
  <label>Scene <select id="scene" class="scene-select"><option value="airport">Thu 5:30 AM, at the airport</option><option value="night">Wed 9:40 PM, the night before</option></select></label>
  <label hidden>Simulate <select id="disrupt" class="scene-select"><option value="">Flight change…</option><option value="delay">Delay 40 min</option><option value="late">Delay 2 h 30 (misses meeting)</option><option value="gate">Gate change</option><option value="cancel">Cancel flight</option><option value="clear">Back to normal</option></select></label>
  <span id="status">Connecting…</span>
</header>
<div class="stage"><div id="frame" class="frame">
  <div id="screen" class="screen">
    <div class="statusbar">
      <span class="round menu" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h10M5 17h14"/></svg></span>
      <span class="weather" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.5" class="sun"/><path d="M7 18h10a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.4A3.3 3.3 0 0 0 7 18z" class="cloud"/></svg>54°</span>
      <span id="clock" class="clock">5:30</span>
    </div>
    <div class="sheet">
      <div class="handle" aria-hidden="true"></div>
      <div class="sheet-tools"><span class="round" role="button" aria-label="Show earlier responses" tabindex="0"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7L4 8.5M4 4v4.5h4.5M12 8v4l3 2"/></svg></span><span class="round"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M7 10h.01M11 10h.01M15 10h.01M7 14h10"/></svg></span></div>
      <div id="convo" class="convo" aria-live="polite"></div>
    </div>
    <div id="caption" class="caption" aria-live="polite"></div>
    <div class="lightbar" aria-hidden="true"><i></i></div>
    <div id="ambient" class="ambient" aria-label="Home screen">
      <div class="amb-scene" id="ambScene"></div>
      <div class="amb-top"><span id="ambDate">Wed, Oct 14</span><span class="amb-wx"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="3.5" class="sun"/><path d="M7 18h10a4 4 0 0 0 0-8 5 5 0 0 0-9.6 1.4A3.3 3.3 0 0 0 7 18z" class="cloud"/></svg>54°</span></div>
      <div class="amb-time" id="ambTime">9:40</div>
      <div class="amb-trip" id="ambTrip" hidden></div>
      <div class="amb-card"><span class="amb-k">Try saying</span><span class="amb-v" id="ambTry">“Alexa, I need to be at an 11 AM meeting in San Francisco tomorrow.”</span></div>
    </div>
    <div id="fullscreen" class="fullscreen" hidden></div>
    <div id="modal" class="modal" hidden></div>
  </div>
</div></div>
<form id="say" class="say"><button type="button" id="mic" class="mic" aria-pressed="false" aria-label="Talk to Alexa"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><input id="utter" placeholder="Say something to Alexa, for example: I need to be at an 11 AM meeting in San Francisco tomorrow" aria-label="What you say to Alexa"><button>Say</button></form>
<script type="module" src="./host.js"></script>
</body></html>
