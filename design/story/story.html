<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><link rel="stylesheet" href="motion.css"><style>
:root { --ease-enter: cubic-bezier(.05,.7,.1,1); }
html,body { margin:0; width:1920px; height:1080px; overflow:hidden; background:#05080E; font-family:"GC Sans", system-ui; color:#fff; }
.shot { position:absolute; inset:0; opacity:0; animation: shot var(--d) linear var(--t) both; }
.shot.title { animation: shotLast var(--d) linear var(--t) both; }
@keyframes shot { 0% { opacity:0 } 8% { opacity:1 } 90% { opacity:1 } 100% { opacity:0 } }
@keyframes shotLast { 0% { opacity:0 } 10% { opacity:1 } 100% { opacity:1 } }
.bg, .bg .scene { position:absolute; inset:0; width:100%; height:100%; display:block; }
.bg { animation: kb calc(var(--d) + 1s) ease-out var(--t) both; }
@keyframes kb { from { transform: scale(1.08) } to { transform: scale(1) } }
.copy { position:absolute; left:120px; bottom:130px; max-width:1300px; text-shadow: 0 4px 40px rgba(0,0,0,.45); }
.eyebrow { font-size:40px; font-weight:400; opacity:0; animation: up 900ms var(--ease-enter) calc(var(--t) + .35s) both; color:#DDE8F5; }
.big { font-size:150px; font-weight:500; line-height:1.02; letter-spacing:-.01em; margin-top:10px; opacity:0; animation: up 1000ms var(--ease-enter) calc(var(--t) + .6s) both; font-variant-numeric: tabular-nums; }
.big b { font-weight:600; } .big i { font-style:normal; font-size:.5em; font-weight:400; }
.big .bad { color:#FF8A7A; }
.sub { font-size:44px; color:#FFB5A8; margin-top:18px; opacity:0; animation: up 900ms var(--ease-enter) calc(var(--t) + 1.9s) both; }
.pm { display:inline-block; background:#FF8A7A; color:#1a0c0a; font-size:.5em; padding:4px 22px; border-radius:22px; vertical-align:middle; transform-origin:center; animation: slam 520ms cubic-bezier(.34,1.56,.64,1) calc(var(--t) + 1.3s) both; text-shadow:none; }
@keyframes slam { from { opacity:0; transform: scale(2.4) rotate(-6deg) } }
#tick.late { color:#FF8A7A; transition: color .3s; }
@keyframes up { from { opacity:0; transform: translateY(30px) } to { opacity:1; transform:none } }
.title .bg::after { content:""; position:absolute; inset:0; background: radial-gradient(900px 420px at 50% 34%, rgba(5,10,22,.62), transparent 75%), linear-gradient(180deg, rgba(5,8,14,.35), transparent 50%); }
.shot:nth-child(3) .s-taxi { animation: roll 3.6s cubic-bezier(.5,0,.8,.4) calc(var(--t) + .4s) both; }
@keyframes roll { to { transform: translateX(260px); } }
.brandwrap { position:absolute; inset:0 0 38% 0; display:grid; place-items:center; }
.brand { display:flex; align-items:center; gap:36px; opacity:0; animation: up 1100ms var(--ease-enter) calc(var(--t) + .5s) both; }
.mark { width:130px; height:142px; filter: drop-shadow(0 6px 30px rgba(255,181,71,.35)); }
.name { font-size:150px; font-weight:600; letter-spacing:-.02em; line-height:1; }
.tag { font-size:40px; color:#DDE8F5; margin-top:14px; max-width:980px; }
</style></head><body><main id="root"></main><script src="story.js"></script></body></html>
