<!doctype html><html><head><meta charset="utf-8"><style>
body{background:#0E1A27;color:#C3D0DD;font:13px system-ui;margin:16px}
.row{display:grid;grid-template-columns:repeat(9,1fr);gap:8px}
.tile{aspect-ratio:4/3;border-radius:10px;overflow:hidden}
.tile svg,.wide svg{display:block;width:100%;height:100%}
figure{margin:0} figcaption{padding:3px 2px}
.wide{aspect-ratio:4/1;margin:10px 0;border-radius:12px;overflow:hidden}
h2{font-weight:500;margin:14px 0 6px}
</style><link rel="stylesheet" href="motion.css"></head><body><script src="scenes.js"></script></body></html>
