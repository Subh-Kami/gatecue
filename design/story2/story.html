<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts.css"><style>
:root { --e: cubic-bezier(.05,.7,.1,1); }
html,body { margin:0; width:1920px; height:1080px; overflow:hidden; background:#05080E; font-family:"GC Sans",system-ui; color:#fff; }
.shot { position:absolute; inset:0; opacity:0; animation: shot var(--d) linear var(--t) both; }
.shot.last { animation-name: shotLast; }
@keyframes shot { 0% {opacity:0} 7% {opacity:1} 92% {opacity:1} 100% {opacity:0} }
@keyframes shotLast { 0% {opacity:0} 8% {opacity:1} 100% {opacity:1} }
.shot video, .shot img.bg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; animation: kb calc(var(--d) + .6s) ease-out var(--t) both; }
@keyframes kb { from { transform: scale(1.1) } to { transform: scale(1.0) } }
.shade { position:absolute; inset:0; background: linear-gradient(90deg, rgba(3,7,15,.72) 0%, rgba(3,7,15,.35) 40%, rgba(3,7,15,0) 70%), linear-gradient(0deg, rgba(3,7,15,.55), transparent 45%); }
.copy { position:absolute; left:120px; bottom:130px; max-width:1300px; text-shadow: 0 4px 40px rgba(0,0,0,.4); }
.eyebrow { font-size:42px; color:#E3ECF7; opacity:0; animation: up 900ms var(--e) calc(var(--t) + .35s) both; }
.big { font-size:150px; font-weight:500; line-height:1.02; letter-spacing:-.01em; margin-top:10px; opacity:0; animation: up 1000ms var(--e) calc(var(--t) + .6s) both; font-variant-numeric: tabular-nums; }
.big b { font-weight:600 } .big i { font-style:normal; font-size:.5em; font-weight:400 } .bad { color:#FF8A7A }
.sub { font-size:46px; color:#FFB5A8; margin-top:18px; opacity:0; animation: up 900ms var(--e) calc(var(--t) + 1.9s) both; }
.pm { display:inline-block; background:#FF8A7A; color:#1a0c0a; font-size:.5em; padding:4px 22px; border-radius:22px; vertical-align:middle; animation: slam 520ms cubic-bezier(.34,1.56,.64,1) calc(var(--t) + 1.3s) both; text-shadow:none; }
@keyframes slam { from { opacity:0; transform: scale(2.4) rotate(-6deg) } }
@keyframes up { from { opacity:0; transform: translateY(30px) } to { opacity:1; transform:none } }
#tick.late { color:#FF8A7A }
.last .shade { background: linear-gradient(90deg, rgba(3,8,18,.82) 0%, rgba(3,8,18,.55) 34%, rgba(3,8,18,0) 62%); }
.brandwrap { position:absolute; left:120px; top:0; bottom:0; display:flex; align-items:center; }
.brand { display:flex; align-items:center; gap:36px; opacity:0; animation: up 1100ms var(--e) calc(var(--t) + .5s) both; }
.mark { width:130px; height:142px; filter: drop-shadow(0 6px 30px rgba(255,181,71,.4)); }
.name { font-size:150px; font-weight:600; letter-spacing:-.02em; line-height:1; text-shadow: 0 6px 40px rgba(0,0,0,.35); }
.tag { font-size:40px; color:#EEF4FB; margin-top:14px; max-width:760px; text-shadow: 0 2px 20px rgba(0,0,0,.5); }
</style></head><body><main id="root"></main><script src="story.js"></script></body></html>
